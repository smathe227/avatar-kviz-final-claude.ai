<path d="M100 150 C160 200 140 280 200 320 C260 360 240 440 300 480" stroke="#67e8f9" stroke-width="3" fill="none" opacity="0.7"/>
<path d="M690 140 C630 190 650 270 590 310 C530 350 550 430 490 470" stroke="#f472b6" stroke-width="3" fill="none" opacity="0.6"/>
<!-- glowing spore dots -->
<g>
  <circle cx="150" cy="220" r="14" fill="url(#glow1)"/>
  <circle cx="150" cy="220" r="4" fill="#a5f3fc"/>
  <circle cx="250" cy="340" r="18" fill="url(#glow2)"/>
  <circle cx="250" cy="340" r="5" fill="#fbcfe8"/>
  <circle cx="340" cy="200" r="10" fill="url(#glow1)"/>
  <circle cx="340" cy="200" r="3" fill="#a5f3fc"/>
  <circle cx="480" cy="380" r="16" fill="url(#glow1)"/>
  <circle cx="480" cy="380" r="4" fill="#a5f3fc"/>
  <circle cx="600" cy="250" r="12" fill="url(#glow2)"/>
  <circle cx="600" cy="250" r="4" fill="#fbcfe8"/>
  <circle cx="560" cy="420" r="20" fill="url(#glow1)"/>
  <circle cx="560" cy="420" r="5" fill="#a5f3fc"/>
  <circle cx="220" cy="450" r="10" fill="url(#glow2)"/>
