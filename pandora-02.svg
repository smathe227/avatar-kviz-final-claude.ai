<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
<defs>
  <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#020617"/>
    <stop offset="60%" stop-color="#0a2a3a"/>
    <stop offset="100%" stop-color="#062a2a"/>
  </linearGradient>
  <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#67e8f9" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#f472b6" stop-opacity="0.9"/>
    <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="moon1" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#e0f2fe"/>
    <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0.4"/>
  </radialGradient>
</defs>
<rect width="800" height="600" fill="url(#sky2)"/>
<circle cx="680" cy="90" r="45" fill="url(#moon1)"/>
<circle cx="680" cy="90" r="30" fill="#f0f9ff" opacity="0.9"/>
<!-- tree trunks -->
<path d="M80 600 C90 400 70 300 100 150" stroke="#0f2418" stroke-width="26" fill="none"/>
<path d="M720 600 C700 420 730 300 690 140" stroke="#0f2418" stroke-width="30" fill="none"/>
<path d="M400 600 C410 480 390 420 405 320" stroke="#0f2418" stroke-width="18" fill="none"/>
