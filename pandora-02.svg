</g>
<!-- fern silhouettes -->
<path d="M0 600 C40 500 20 460 60 400 C30 470 60 520 0 600Z" fill="#031014"/>
<path d="M800 600 C760 500 780 460 740 400 C770 470 740 520 800 600Z" fill="#031014"/>
